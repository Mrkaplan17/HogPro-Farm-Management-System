# Netlify build configuration — build settings live in code so the
# dashboard UI (base directory / build / publish) doesn't need manual setup.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the Render backend (must come before the SPA catch-all).
[[redirects]]
  from = "/api/*"
  to = "https://piggery-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA catch-all — route everything else to the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200