services:
  - type: web
    name: piggery-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PIGGERY_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-SITE.netlify.app
      # DATABASE_URL is intentionally NOT set here — paste your Supabase
      # pooler URL as a secret in the Render dashboard (Security > Environment).
      # Never commit database credentials to the repository.